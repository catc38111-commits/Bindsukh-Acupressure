    <script>
      // Global capture of beforeinstallprompt early so it is never missed by UI
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // Register PWA Service Worker on window load
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Bindsukh PWA Service Worker active:', reg.scope);
          }).catch(function(err) {
            console.warn('PWA Service Worker registration warning:', err);
          });
        });
      }

      // Suppress Vite HMR WebSocket disconnect noise in AI Studio iFrame environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason?.message?.includes('WebSocket') || String(e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });

      (function() {
        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('WebSocket') !== -1)) {
            console.warn.apply(console, arguments);
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
